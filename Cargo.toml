[package]
name = "winopti"
version = "1.0.0"
edition = "2021"
description = "WinOpti - Otimizador temporario de desempenho do Windows"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
sysinfo = { version = "=0.32.1", default-features = false, features = ["system", "disk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Services", "Win32_Security"] }

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
